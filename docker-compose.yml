services:
  mongo:
    image: mongo:7
    container_name: furnistore-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
      - ./docker/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    container_name: furnistore-mailhog
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: furnistore-server
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/furniture_shop
      CLIENT_URL: http://localhost:5173
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      JWT_ACCESS_SECRET: dev-access-secret-change-in-production-32chars
      JWT_REFRESH_SECRET: dev-refresh-secret-change-in-production-32chars
    volumes:
      - ./server/uploads:/app/server/uploads
    depends_on:
      mongo:
        condition: service_healthy
      mailhog:
        condition: service_started

  client:
    image: node:20-alpine
    container_name: furnistore-client
    working_dir: /app
    command: sh -c "npm ci && npm run dev -w client -- --host 0.0.0.0"
    ports:
      - '5173:5173'
    environment:
      VITE_API_URL: http://localhost:5000/api/v1
    volumes:
      - .:/app
      - client_node_modules:/app/node_modules
      - client_app_node_modules:/app/client/node_modules
    depends_on:
      - server

volumes:
  mongo_data:
  client_node_modules:
  client_app_node_modules: